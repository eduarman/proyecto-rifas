<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="Premio: auto deportivo con regalos">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="560" height="320" fill="url(#sky)"/>
  <rect width="560" height="320" fill="url(#glow)"/>

  <!-- ground -->
  <rect y="238" width="560" height="82" fill="#0b1220" opacity="0.55"/>
  <ellipse cx="280" cy="256" rx="230" ry="26" fill="#000" opacity="0.28"/>

  <!-- sparkles -->
  <g fill="#fbbf24">
    <path d="M92 54l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
    <path d="M470 40l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity="0.9"/>
    <circle cx="150" cy="30" r="3" opacity="0.8"/>
    <circle cx="420" cy="96" r="2.5" opacity="0.7"/>
    <circle cx="60" cy="150" r="2.5" opacity="0.6"/>
  </g>

  <!-- sports car -->
  <g transform="translate(140 118)">
    <path d="M12 92c-6-2-9-8-8-15l3-16c1-6 5-11 11-13l40-13c8-3 17-4 25-4h44c14 0 27 6 36 16l22 24c4 4 9 6 15 7l24 3c9 1 16 8 16 17v6c0 6-5 11-11 11h-24" fill="url(#body)"/>
    <path d="M70 22c9-3 26-4 40-1 10 2 18 8 24 16l10 13H92l-4-28z" fill="#60a5fa" opacity="0.85"/>
    <path d="M150 24c9 1 17 6 22 13l10 13h-20l-16-26z" fill="#93c5fd" opacity="0.85"/>
    <rect x="0" y="74" width="270" height="10" rx="5" fill="#0b1220"/>
    <!-- wheels -->
    <circle cx="66" cy="92" r="26" fill="#0b1220"/>
    <circle cx="66" cy="92" r="12" fill="#334155"/>
    <circle cx="66" cy="92" r="4" fill="#e2e8f0"/>
    <circle cx="208" cy="92" r="26" fill="#0b1220"/>
    <circle cx="208" cy="92" r="12" fill="#334155"/>
    <circle cx="208" cy="92" r="4" fill="#e2e8f0"/>
    <!-- headlight -->
    <path d="M256 60l14 2c3 0 5 3 4 6l-1 4-19-3z" fill="#fde68a"/>
  </g>

  <!-- gift boxes -->
  <g transform="translate(392 176)">
    <rect x="0" y="24" width="64" height="52" rx="6" fill="#f59e0b"/>
    <rect x="0" y="24" width="64" height="16" rx="6" fill="#fbbf24"/>
    <rect x="27" y="24" width="10" height="52" fill="#b45309"/>
    <path d="M32 24c-8-14-24-10-18 0M32 24c8-14 24-10 18 0" fill="none" stroke="#fbbf24" stroke-width="5"/>
  </g>
  <g transform="translate(70 196)">
    <rect x="0" y="18" width="48" height="40" rx="5" fill="#e2e8f0"/>
    <rect x="0" y="18" width="48" height="13" rx="5" fill="#fff"/>
    <rect x="20" y="18" width="8" height="40" fill="#2563eb"/>
    <path d="M24 18c-6-11-18-8-14 0M24 18c6-11 18-8 14 0" fill="none" stroke="#2563eb" stroke-width="4"/>
  </g>
</svg>
